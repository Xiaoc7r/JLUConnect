name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run offline tests
        shell: powershell
        run: |
          $version = '0.1.0-preview.1'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.Substring(1) }
          ./scripts/build.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: JLUConnect-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: JLUConnect-windows-x64
          path: release
      - name: Publish versioned downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = @(Get-ChildItem release -File | ForEach-Object FullName)
          $options = @('--verify-tag', '--title', "JLUConnect $env:GITHUB_REF_NAME", '--generate-notes')
          if ($env:GITHUB_REF_NAME.Contains('-')) { $options += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME @files @options
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing releases are never overwritten automatically.' }
